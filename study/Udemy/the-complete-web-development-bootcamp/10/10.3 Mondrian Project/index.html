<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }

  .container {
    display: grid;
    width: 748px;
    height: 748px;
    grid-template-columns: 329px 207px 162px 50px;
    grid-template-rows: 423px 140px 164px 20px;
  }

  .container > .red {
    background-color: #E72F24;
    border-right: 9px solid #232629;
    border-bottom: 9px solid #232629;
  }

  .container > .white1 {
    background-color: #F0F1EC;
    grid-column: span 3;
    border-bottom: 9px solid #232629;
  }

  .container > .white2 {
    background-color: #F0F1EC;
    grid-row: span 2;
    border-right: 9px solid #232629;
    border-bottom: 9px solid #232629;
  }

  .container > .white3 {
    background-color: #F0F1EC;
    grid-column: span 2;
    grid-row: span 2;
    border-bottom: 9px solid #232629;
    border-right: 9px solid #232629;
  }

  .container > .blue {
    background-color: #004592;
    border-bottom: 10px solid #232629;
  }

  .container > .white4 {
    background-color: #F0F1EC;
    grid-row: span 2;
  }

  .container > .white5 {
    background-color: #F0F1EC;
    border-right: 9px solid #232629;
  }

  .container > .yellow {
    background-color: #F9D01E;
    border-right: 9px solid #232629;
  }

  .container > .black {
    background-color: #232629;

  }

  </style>
</head>

<body>
  <!-- Write your HTML here -->
  <div class="container">
    <div class="red"> </div>
    <div class="white1"></div>
    <div class="white2"></div>
    <div class="white3"></div>
    <div class="blue"></div>
    <div class="white4"></div>
    <div class="white5"></div>
    <div class="yellow"></div>
    <div class="black"></div>
  </div>
</body>

</html>
